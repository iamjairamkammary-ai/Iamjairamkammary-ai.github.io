<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Restricted - Agastya Junior College</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(30, 58, 138, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(14, 116, 144, 0.25) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      position: relative;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 520px;
      width: 100%;
      padding: 40px 36px 32px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.65),
        0 0 30px rgba(30, 64, 175, 0.2);
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: repeating-linear-gradient(
        -45deg,
        #f59e0b,
        #f59e0b 12px,
        #0f172a 12px,
        #0f172a 24px
      );
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .shield-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.6), rgba(14, 116, 144, 0.4));
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.2);
    }

    h1 {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .admin-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-left: 4px solid #f59e0b;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 500;
      color: #f1f5f9;
    }

    .badge {
      display: inline-block;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      font-size: 12.5px;
      padding: 7px 14px;
      border-radius: 8px;
      margin-bottom: 22px;
    }

    .note {
      background: rgba(14, 116, 144, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .note strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-pill">&#9888; Limit Exceeded</div>

    <div class="shield-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1>Blocked by Agastya Junior College</h1>

    <div class="admin-box">
      Contact your IT admin
    </div>

    <div class="badge">Access Control &amp; Administration &bull; Agastya Junior College</div>

    <div class="note">
      <strong>Note:</strong> To continue, change your default browser and restart your device.
    </div>
  </div>
</body>
</html>
